  name: Build and Deploy SkyTicker Backend

  on:
    push:
      branches: [ main ]

  jobs:
    build:
      runs-on: ubuntu-latest
      timeout-minutes: 20

      steps:
        - name: Checkout Code
          uses: actions/checkout@v3

        - name: Set up JDK
          uses: actions/setup-java@v3
          with:
            java-version: '17'
            distribution: 'temurin'

        - name: Build with Maven
          run: mvn clean package -DskipTests

        - name: Upload JAR as Artifact
          uses: actions/upload-artifact@v4
          with:
            name: skyticker-backend-jar
            path: target/*.jar

    deploy:
      runs-on: ubuntu-latest
      needs: build
      timeout-minutes: 10

      steps:
        - name: Download Build Artifact
          uses: actions/download-artifact@v4
          with:
            name: skyticker-backend-jar

        - name: Upload JAR to server via SCP
          uses: appleboy/scp-action@v0.1.7
          with:
            host: ${{ secrets.SERVER_IP }}
            username: ${{ secrets.SSH_USERNAME }}
            key: ${{ secrets.SSH_PRIVATE_KEY }}
            source: "*.jar"
            target: ~/skyticker/deploy/backend
            overwrite: true

    restart:
      runs-on: ubuntu-latest
      needs: deploy
      timeout-minutes: 10

      steps:
        - name: Restart Spring Boot using tmux
          uses: appleboy/ssh-action@v1.0.0
          with:
            host: ${{ secrets.SERVER_IP }}
            username: ${{ secrets.SSH_USERNAME }}
            key: ${{ secrets.SSH_PRIVATE_KEY }}
            script_stop: true
            envs: |
              DATASOURCE_DB_NAME
              DATASOURCE_USERNAME
              DATASOURCE_PASSWORD
              MAIL_USERNAME
              MAIL_PASSWORD
              SECRET_KEY
              ADMIN_EMAIL
              ADMIN_FIRST_NAME
              ADMIN_LAST_NAME
              ADMIN_USERNAME
              ADMIN_PASSWORD
            script: |
              export DATASOURCE_DB_NAME="${{ secrets.DATASOURCE_DB_NAME }}"
              export DATASOURCE_USERNAME="${{ secrets.DATASOURCE_USERNAME }}"
              export DATASOURCE_PASSWORD="${{ secrets.DATASOURCE_PASSWORD }}"
              export MAIL_USERNAME="${{ secrets.MAIL_USERNAME }}"
              export MAIL_PASSWORD="${{ secrets.MAIL_PASSWORD }}"
              export SECRET_KEY="${{ secrets.SECRET_KEY }}"
              export ADMIN_EMAIL="${{ secrets.ADMIN_EMAIL }}"
              export ADMIN_FIRST_NAME="${{ secrets.ADMIN_FIRST_NAME }}"
              export ADMIN_LAST_NAME="${{ secrets.ADMIN_LAST_NAME }}"
              export ADMIN_USERNAME="${{ secrets.ADMIN_USERNAME }}"
              export ADMIN_PASSWORD="${{ secrets.ADMIN_PASSWORD }}"

              # Restart Spring Boot service
              sudo systemctl daemon-reexec
              sudo systemctl restart skyticker.service
